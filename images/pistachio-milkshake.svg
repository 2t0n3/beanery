  <ellipse cx="184" cy="54" rx="4.6" ry="3.2" transform="rotate(30 184 54)"/>
  <ellipse cx="152" cy="54" rx="4.6" ry="3.2" transform="rotate(-6 152 54)"/>
</g>
<!-- straw -->
