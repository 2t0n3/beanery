  <rect x="86" y="60" width="128" height="200" fill="url(#body)"/>
  <path d="M86 126c22 8 34-6 52-3s28 12 46 9 22-10 30-7v14H86Z" fill="#fff" opacity=".22"/>
  <rect x="86" y="60" width="128" height="200" fill="url(#glass)"/>
</g>
<path d="M92 68H208l-14 170a14 14 0 0 1-14 12H120a14 14 0 0 1-14-12Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.6"/>
<g stroke="#fff" stroke-opacity=".7" fill="none" transform="translate(130 146)">
  <path d="M11 6h11c5 0 8.5 3 8.5 7.4 0 3.3-1.9 5.6-4.6 6.6 3.4.8 5.8 3.4 5.8 7.2 0 5.1-4 8.4-9.9 8.4H11V6Z" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M20 40c0-5 2.6-8.4 7.2-9.6M20 40c0-4.2-2.2-7-6-8.2" stroke-width="2" stroke-linecap="round"/>
</g>
<!-- whipped cream -->
<g>
  <path d="M96 68c-4-16 10-24 20-20 2-14 18-20 28-12 6-14 26-14 32 0 12-8 26 0 24 14 12 2 14 16 4 22 4 8-2 14-12 14H108c-10 0-16-8-12-18Z" fill="#F9F3E4"/>
  <path d="M104 60c8-6 12-2 16-8M132 40c6-6 14-4 18 2M170 44c8-4 14 0 16 6" fill="none" stroke="#E3D8C0" stroke-width="2.4" stroke-linecap="round"/>
</g>
<!-- chopped pistachio -->
<g fill="#6E9C5A">
  <ellipse cx="118" cy="46" rx="5" ry="3.4" transform="rotate(-24 118 46)"/>
  <ellipse cx="140" cy="34" rx="5.4" ry="3.6" transform="rotate(16 140 34)"/>
