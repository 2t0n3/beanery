<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Pistachio milkshake with whipped cream and chopped pistachio">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D5E0A6"/><stop offset=".55" stop-color="#B8C980"/><stop offset="1" stop-color="#8FA35B"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity=".48"/><stop offset=".16" stop-color="#fff" stop-opacity=".05"/>
    <stop offset=".74" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/>
  </linearGradient>
  <clipPath id="cup"><path d="M92 68H208l-14 170a14 14 0 0 1-14 12H120a14 14 0 0 1-14-12Z"/></clipPath>
</defs>
<ellipse cx="150" cy="254" rx="58" ry="10" fill="#26241F" opacity=".16"/>
