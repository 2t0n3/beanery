<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Cold foam saffron milk with saffron threads on a stone coaster">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F0C55C"/><stop offset=".5" stop-color="#E2A72F"/><stop offset="1" stop-color="#C2851B"/>
  </linearGradient>
  <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FDF6E8"/><stop offset="1" stop-color="#F0E2C4"/>
  </linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2EDE4"/><stop offset="1" stop-color="#D9D2C6"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity=".48"/><stop offset=".16" stop-color="#fff" stop-opacity=".05"/>
    <stop offset=".74" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/>
  </linearGradient>
  <clipPath id="cup"><path d="M92 68H208l-14 170a14 14 0 0 1-14 12H120a14 14 0 0 1-14-12Z"/></clipPath>
</defs>
<!-- stone coaster -->
<ellipse cx="150" cy="256" rx="80" ry="20" fill="url(#stone)"/>
<path d="M78 258a72 12 0 0 0 144 0v6a72 12 0 0 1-144 0Z" fill="#C4BCAE"/>
<path d="M96 250c18-6 40-2 58 2M120 262c22 4 44 2 62-4" fill="none" stroke="#B9B0A0" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
<g clip-path="url(#cup)">
  <rect x="86" y="60" width="128" height="200" fill="url(#body)"/>
  <rect x="86" y="60" width="128" height="56" fill="url(#foam)"/>
  <path d="M86 114c22 10 36-4 54 0s30 10 48 6 18-8 26-6v14H86Z" fill="#F6E6C2" opacity=".55"/>
  <rect x="86" y="60" width="128" height="200" fill="url(#glass)"/>
</g>
<path d="M92 68H208l-14 170a14 14 0 0 1-14 12H120a14 14 0 0 1-14-12Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.6"/>
<g stroke="#fff" stroke-opacity=".7" fill="none" transform="translate(130 146)">
  <path d="M11 6h11c5 0 8.5 3 8.5 7.4 0 3.3-1.9 5.6-4.6 6.6 3.4.8 5.8 3.4 5.8 7.2 0 5.1-4 8.4-9.9 8.4H11V6Z" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M20 40c0-5 2.6-8.4 7.2-9.6M20 40c0-4.2-2.2-7-6-8.2" stroke-width="2" stroke-linecap="round"/>
</g>
<!-- foam crown above the rim -->
<path d="M92 70c0-16 26-24 58-24s58 8 58 24Z" fill="#FDF7EA"/>
<path d="M92 70c0-16 26-24 58-24s58 8 58 24" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2.4"/>
<!-- saffron threads -->
<g stroke="#B3401A" stroke-width="2.6" stroke-linecap="round" fill="none">
  <path d="M126 54c8-5 14-2 20-6"/><path d="M152 50c7 4 14 1 20 5"/><path d="M138 60c8 1 14-4 22-2"/>
</g>
<!-- straw -->
<g transform="rotate(-11 124 58)">
  <rect x="118" y="6" width="12" height="68" rx="6" fill="#C9A227"/>
  <rect x="118" y="6" width="12" height="68" rx="6" fill="#fff" opacity=".2"/>
</g>
<!-- crocus flower -->
<g transform="translate(240 230) scale(1.25)">
  <path d="M0 18C-4 6-2-8 0-16 2-8 4 6 0 18Z" fill="#9B87D2"/>
  <path d="M0 18C-10 10-18-2-22-11-13-8-2 6 0 18Z" fill="#8B7BC7"/>
  <path d="M0 18C10 10 18-2 22-11 13-8 2 6 0 18Z" fill="#7E6DBB"/>
  <path d="M0 19c-6 2-12 6-15 12 7 1 13-3 15-6 2 3 8 7 15 6-3-6-9-10-15-12Z" fill="#6E9C5A"/>
  <path d="M-2 2c0 4 4 4 4 0" fill="none" stroke="#E8CE86" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
