<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Beanery">
  <!--
    The real mark on the brand tile. See images/logo.svg for how the
    monogram was rebuilt and why.

    The mark is scaled to 44 units tall inside a 64 tile, which leaves
    a 10-unit margin. The stroke is scaled with it (4.6 x 0.695 = 3.2)
    because this is a monoline logo — scaling the geometry without the
    stroke would quietly turn it into a different mark.

    At 16px the leaves inevitably fill in. That is the correct
    trade: a favicon is recognised by its silhouette and colour, and
    simplifying to a bare "B" would lose what makes this one Beanery's.
  -->
  <rect width="64" height="64" rx="13" fill="#2F6136"/>
  <g transform="translate(32 32) scale(0.695) translate(-25.35 -31.65) translate(-30.05 -16.4)"
     fill="none" stroke="#E8C56A" stroke-width="4.6"
     stroke-linecap="butt" stroke-linejoin="round">
    <path d="M36 18.7 H57.8 C67.2 18.7 72.8 24 72.8 30.4 C72.8 36.9 67.2 42.6 57.8 42.6 H47
             C59.4 42.6 78.4 46 78.4 59.9 C78.4 71.5 67.2 77.4 55 77.4 H50"/>
    <path d="M38.5 24 V46"/>
    <path d="M51.2 54.8 C49.8 61.5 48.4 68.6 47.4 76.4"/>
    <path d="M49.2 36.2 C44.8 41.6 44.6 48.6 51.2 54.8 C56 47.8 54.4 41.4 49.2 36.2 Z"/>
    <path d="M32.8 49.8 C31 60.4 34.8 70.8 44.8 76.2 C44.4 64.8 40.2 55.4 32.8 49.8 Z"/>
    <path d="M61.2 55.8 C54.4 55.8 49.8 59.6 48.8 66.2 C56 66.2 60.2 62.2 61.2 55.8 Z"/>
  </g>
</svg>
